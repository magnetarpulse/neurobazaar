<!DOCTYPE html>
<html>
<head>
    <title>OOD Analyzer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .banner {
            background: linear-gradient(to right, #1a1f2e, #2c3347);
            color: white;
            padding: 20px;
            margin-top: 64px;
        }
        .banner-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: flex-start;
        }
        .logo-container {
            width: 75px;
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 0.35rem;
            transition: transform 0.3s ease;
            margin-right: 16px;
        }

        .logo-container:hover {
            transform: scale(1.05);
        }
        .banner-text {
            flex-grow: 1;
        }
        .banner h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }
        .banner p {
            margin: 5px 0 0 0;
            color: #a0a7b7;
            font-size: 14px;
        }
        .back-button {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-weight: 500;
            font-size: 0.875rem;
            transition: all 0.3s ease;
            text-decoration: none;
            margin-top: 12px;
        }
        .back-button:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
        .v-main {
            padding: 0px 0px 0px 0px;
        }
    </style>
</head>
<body>
    <div class="banner">
        <div class="banner-content">
            <div class="logo-container">
                <img src="/static/assets/img/logo-main.png" alt="Neurobazaar" width="48" height="14">
            </div>
            <div class="banner-text">
                <h1>OOD Analyzer</h1>
                <p>Interactive data visualization and analysis</p>
            </div>
            <a href="/dashboard" class="back-button">← Back to Dashboard</a>
        </div>
    </div>
    <div id="pr-content">  
        {{ proxied_content|safe }}
    </div>
</body>
</html>
